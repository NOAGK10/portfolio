<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>נעה — תיק עבודות</title>
  <meta name="description" content="תיק העבודות של נעה — אתרים, תוכנה ווידאו: מהרעיון ועד הביצוע.">
  <meta name="theme-color" content="#0b0b0c">
  <!-- link preview (WhatsApp, email, LinkedIn…) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:title" content="נעה — תיק עבודות">
  <meta property="og:description" content="אתרים, תוכנה ווידאו — מהרעיון ועד הביצוע. כל הפרויקטים במקום אחד.">
  <meta property="og:url" content="https://noagk10.github.io/portfolio/">
  <meta property="og:image" content="https://noagk10.github.io/portfolio/images/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0c'/%3E%3Ccircle cx='46' cy='46' r='7' fill='%23d6ff3d'/%3E%3Ctext x='30' y='44' font-size='34' font-family='Arial' font-weight='700' fill='%23f3f1ea' text-anchor='middle'%3E%D7%A0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="spot" aria-hidden="true"></div>

  <header class="nav">
    <a href="#top" class="logo" data-site="name"></a>
    <nav>
      <a href="#work">עבודות</a>
      <a href="#about">עליי</a>
      <a href="#contact">צור קשר</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="hero-kicker">תיק עבודות · <span id="year"></span></p>
      <h1 class="hero-title">
        <span class="line" data-site="name"></span>
        <span class="line outline">עושה</span>
        <span class="line rotator"><span id="rotWord"></span></span>
      </h1>
      <div class="hero-foot">
        <p class="hero-role" data-site="role"></p>
        <div class="stats">
          <div><b id="statProjects">0</b><span>פרויקטים</span></div>
          <div><b id="statCats">0</b><span>תחומים</span></div>
        </div>
      </div>
      <a href="#work" class="scroll-cue" aria-label="גלילה לעבודות">↓</a>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <section id="featured" class="featured">
      <div class="section-head">
        <h2>נבחרים<span class="dot">.</span></h2>
        <p class="feat-sub">הפרויקטים שאני הכי גאה בהם</p>
      </div>
      <div class="feat-grid" id="featGrid"></div>
    </section>

    <section id="work" class="work">
      <div class="section-head">
        <h2>עבודות<span class="dot">.</span></h2>
        <div class="filters" id="filters" role="tablist" aria-label="סינון לפי קטגוריה"></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="about" class="about">
      <h2>קצת עליי<span class="dot">.</span></h2>
      <p class="about-text" data-site="about"></p>
    </section>

    <section id="contact" class="contact">
      <p class="contact-kicker">בואו נעבוד ביחד</p>
      <a class="contact-mail" id="mail"></a>
      <div class="socials" id="socials"></div>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year2"></span> <span data-site="name"></span></span>
    <a href="#top">חזרה למעלה ↑</a>
  </footer>

  <dialog class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="סגירה">✕</button>
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-body">
      <span class="pill" id="modalCat"></span>
      <h3 id="modalTitle"></h3>
      <p class="modal-meta" id="modalMeta"></p>
      <p id="modalDesc"></p>
      <div class="tags" id="modalTags"></div>
      <a class="btn" id="modalLink" target="_blank" rel="noopener">לצפייה בפרויקט ←</a>
    </div>
  </dialog>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
